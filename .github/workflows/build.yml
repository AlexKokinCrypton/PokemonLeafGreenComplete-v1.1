name: Build LeafGreen

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache agbcc
        id: cache-agbcc
        uses: actions/cache@v4
        with:
          path: agbcc
          key: agbcc-${{ runner.os }}-v1
          restore-keys: |
            agbcc-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libpng-dev

      - name: Clone agbcc
        if: steps.cache-agbcc.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/pret/agbcc.git agbcc

      - name: Build agbcc
        if: steps.cache-agbcc.outputs.cache-hit != 'true'
        working-directory: agbcc
        run: |
          ./build.sh

      - name: Install agbcc
        working-directory: agbcc
        run: |
          ./install.sh ..

      - name: Build LeafGreen
        run: |
          make leafgreen -j$(nproc)

      - name: Upload LeafGreen ROM
        uses: actions/upload-artifact@v4
        with:
          name: PokemonLeafGreenComplete
          path: pokeleafgreen.gba
          if-no-files-found: error
